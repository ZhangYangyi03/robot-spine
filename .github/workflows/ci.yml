name: ci
on: [push, pull_request]
jobs:
  bench:
    name: stdlib path (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: the verification path has no third-party imports
        shell: bash
        # Three deliberate exceptions, each for its own reason:
        #   mujoco_backend.py / bench_mujoco.py -- the witness that did not write
        #     the plant; its whole point is to be a foreign implementation.
        #   policy.py / bench_policy.py -- the learned layer, torch-only by
        #     design; the 121k-param network is a .pt, not something this repo
        #     can express in the standard library.
        # Everything else -- the solver, the collision model, the gate, the
        # controller, every other bench -- must import nothing. tests/ is not
        # scanned: a test is allowed to bring numpy in to check the library.
        run: |
          if grep -rnE '^\s*(import|from)\s+(numpy|scipy|torch|mujoco|pybullet)' \
               spine bench \
               --exclude=mujoco_backend.py --exclude=bench_mujoco.py \
               --exclude=policy.py --exclude=bench_policy.py; then
            echo "the stdlib path must stay stdlib-only"; exit 1
          fi
      - name: tests
        # numpy is a test-time dependency only: one test cross-checks the
        # voxel rotation with numpy's determinant, which is a check on the
        # library, not a dependency of it.
        run: |
          python -m pip install --upgrade pip numpy
          python -m unittest discover -s tests -v
      - name: bench
        run: python bench/bench.py
      - name: the claims in the README are the numbers in results.json
        run: python bench/check_claims.py

  physics:
    name: physics check (mujoco, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mujoco==3.2.7
      - name: the engine loads and agrees with the plant
        # This job exists because a skipped physics check and a passed physics check
        # must not look the same. In the stdlib jobs above, MuJoCo is absent and the
        # section records WHY it was skipped; here it is present and the numbers are
        # asserted.
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.')
          from bench import bench_mujoco
          r = bench_mujoco.run()
          assert 'skipped' not in r, r.get('detail')
          g = r['gravity']['max_abs_difference_Nm']
          assert g < 1e-9, 'plant and engine disagree about gravity: %r' % g
          gap = r['same_pd_two_plants']['max_gap_in_the_final_state_rad']
          assert gap == 0.0, 'the two plants no longer share a fixed point: %r' % gap
          comp = r['gravity_comp_through_the_engine']['max_joint_error_rad']
          assert comp < 1e-4, comp
          print('engine agrees: gravity %.2e N*m, fixed-point gap %r, comp %s' % (g, gap, comp))
          PY
      - name: the tests that need the engine actually run, not skip
        run: python -m unittest tests.test_spine.TestMuJoCoAgreement -v
